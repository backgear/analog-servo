; PlatformIO Project Configuration File -- analog-servo firmware
; Closed-loop analog torque-command servo controller: takes either step/dir
; pulses (Mode A), a high-level velocity command (Mode B), or an analog
; velocity input (Mode C), runs a cascaded position(P)->velocity(PI) loop,
; and drives an external torque amplifier via DAC analog output.
;
; One board, one output path: NUCLEO-L152RE, real on-chip DAC. Other
; hardware paths (another MCU family, a second dedicated monitor UART,
; two-phase/Hall commutation output, Tamagawa feedback) aren't supported
; here at all, not behind a build flag -- see AGENTS.md for what's not
; in this tree yet and why.

[platformio]
default_envs = analog_servo

[env:analog_servo]
platform  = ststm32@~19.7.1
board     = nucleo_l152re            ; Cat.5, 512K flash / 80K RAM, real DAC1 (PA4/PA5)
framework = stm32cube

build_src_filter = +<*>
build_flags =
    -I include
    -D USE_HAL_DRIVER
    -D STM32L152xE
    -D HSE_VALUE=8000000          ; ST-Link's own MCO, NOT a crystal -- SystemClock_Config
                                   ; uses RCC_HSE_BYPASS, not RCC_HSE_ON.
    -D SYSCLK_HZ=32000000         ; 8 MHz HSE -> PLL x12 /3 = 32 MHz SYSCLK (L1's max).
                                   ; Drives Ramp.c's RAMP_DENOM -- keep in sync with
                                   ; SystemClock_Config (main.c).

lib_ldf_mode = chain+

upload_protocol = stlink
debug_tool      = stlink

[env:native]
; Host-side unit tests for the HAL-independent math and logic: the cascaded
; P->PI control loop + anti-windup (Control.c), the Mode B ramp generator
; (Ramp.c), the point-to-point ramped position move built on top of it
; (PositionMove.c), the latched hard-fault detectors (Fault.c), the
; built-in open-loop test-signal generator (Signal.c), the polarity-learn
; pass/fail decision (Polarity.c), the relay-feedback velocity-loop
; autotune (Autotune.c), and the protocol parser/registry (Protocol.c).
; Run: pio test -e native
platform         = native
test_framework   = unity
test_build_src   = yes
build_src_filter = -<*> +<Control.c> +<Ramp.c> +<PositionMove.c> +<Fault.c> +<Analog.c> +<Signal.c> +<Polarity.c> +<Protocol.c> +<Monitor.c> +<Autotune.c>
build_flags =
    -I test/mocks
    -I include
    -std=gnu11
    -Wall
    -lm
    -D SYSCLK_HZ=32000000
; test/mocks listed FIRST: this project's include/usbd_cdc_composite_if.h is
; real -- it must be shadowed by test/mocks/usbd_cdc_composite_if.h, so the
; mock directory has to win the search order.
