; PlatformIO Project Configuration File -- analog-servo firmware
; Closed-loop analog torque-command servo controller: takes either step/dir
; pulses (Mode A), a high-level velocity command (Mode B), or an analog
; velocity input (Mode C), runs a cascaded position(P)->velocity(PI) loop,
; and drives an external torque amplifier via DAC analog output.
;
; This build adds a second board, STM32F103C8T6 "Blue Pill": no on-chip
; DAC on that part at all, so its only output path is RC-filtered PWM
; (docs/rc-filter.md), not a DAC-vs-PWM toggle. Boot, USB reset, and flash
; addressing have been checked on hardware; Mode A and Mode C have not.
; See README.md for build commands and validation limits.
;
; `env:analog_servo` below is L152's bench-validated default (single-
; channel analog_torque output). This build also adds
; `env:analog_servo_two_phase` alongside it -- Hall-sector-commutated
; two-phase output, NOT bench-verified (no real Hall sensor/CD4053
; sign-switch hardware on hand), kept as its own env so the default build
; never pays for or risks shipping it; L152-only, see Output.h -- F103's
; PWM+RC output stage doesn't implement this topology. Other unverified
; hardware paths (a second dedicated monitor UART, Tamagawa feedback) live
; as their own separate draft-PR branches -- see AGENTS.md.

[platformio]
default_envs = analog_servo

[env:analog_servo]
platform  = ststm32@~19.7.1
board     = nucleo_l152re            ; Cat.5, 512K flash / 80K RAM, real DAC1 (PA4/PA5)
board_build.ldscript = ld/STM32L152RETX_FLASH.ld   ; stock + build-ID note, see that file
framework = stm32cube

; Hall.c/Commutation.c excluded here -- this env never defines
; ANALOG_SERVO_TWO_PHASE_DRIVE, so main.c/Protocol.c's two-phase code paths
; compile to degenerate always-idle/always-failed stubs and never reference
; either file; see env:analog_servo_two_phase below for the env that does.
; *_f1.c/stm32f1xx_it.c excluded here too -- F103-only glue, see
; env:analog_servo_f103 below.
build_src_filter = +<*> -<Hall.c> -<Commutation.c> -<*_f1.c> -<stm32f1xx_it.c>
build_flags =
    -I include
    -D USE_HAL_DRIVER
    -D STM32L152xE
    -D HSE_VALUE=8000000          ; ST-Link's own MCO, NOT a crystal -- SystemClock_Config
                                   ; uses RCC_HSE_BYPASS, not RCC_HSE_ON.
    -D SYSCLK_HZ=32000000         ; 8 MHz HSE -> PLL x12 /3 = 32 MHz SYSCLK (L1's max).
                                   ; Drives Ramp.c's RAMP_DENOM -- keep in sync with
                                   ; SystemClock_Config (main.c).
    -D ANALOG_SERVO_HAS_AUTOTUNE   ; relay autotune (Autotune.c) + online RLS (RLS.c/
                                   ; GainGlide.c) -- omitted when FLASH_IS_SCARCE, see
                                   ; env:analog_servo_f103 below.
    -D ANALOG_SERVO_HAS_UART       ; USART2 CLI console (usart_l1.c) alongside composite
                                   ; USB -- omitted when FLASH_IS_SCARCE, see below.
    -Wl,--build-id=sha1            ; image identity for `get build.id`

lib_ldf_mode = chain+
extra_scripts =
    pre:scripts/fw_version.py      ; `version` from git describe
    post:scripts/ldscript_dep.py   ; relink when ld/*.ld changes

upload_protocol = stlink
debug_tool      = stlink

[env:analog_servo_f103]
; STM32F103C8T6 "Blue Pill", LQFP48 -- only PC13/PC14/PC15 physically exist
; on Port C on this package (see docs/boards.md); no on-chip DAC silicon at
; all, torque output is RC-filtered PWM. See README.md for the hardware
; checks completed and the modes that still need bench validation.
platform  = ststm32@~19.7.1
board     = genericSTM32F103C8
board_upload.maximum_size = 64512   ; 63 KiB code + final 1 KiB config page
board_build.ldscript = ld/STM32F103C8TX_FLASH.ld   ; stock + build-ID note, see that file
framework = stm32cube

; Exclude the L1 glue -- *_l1.c/stm32l1xx_it.c reference peripherals (DAC,
; TIM6) that don't exist on F103 and/or would duplicate symbols (IRQ
; handlers, AdcInit/UsartInit/...) against this env's own *_f1.c files.
; Hall.c/Commutation.c excluded too -- two-phase output is L152-DAC-only,
; see Output.h; this board never defines ANALOG_SERVO_TWO_PHASE_DRIVE.
; FLASH_IS_SCARCE omits autotune/RLS and the UART CLI (main.h). Their
; sources still compile, but unused implementations are garbage-collected
; at link time. The 128 KiB env removes this define to restore the features.
build_src_filter = +<*> -<*_l1.c> -<stm32l1xx_it.c> -<Hall.c> -<Commutation.c>
build_flags =
    -I include
    -D USE_HAL_DRIVER
    -D STM32F103xB
    -D FLASH_IS_SCARCE
    -D HSE_VALUE=8000000          ; Blue Pill crystal is 8 MHz; must hold exactly for the
                                   ; 48 MHz USB tap (72 MHz SYSCLK / 1.5) to land on-spec.
    -D SYSCLK_HZ=72000000         ; 8 MHz HSE -> PLL x9 -> 72 MHz SYSCLK. Drives Ramp.c's
                                   ; RAMP_DENOM -- keep in sync with SystemClock_Config (main.c).
    -Wl,--build-id=sha1            ; image identity for `get build.id`

lib_ldf_mode = chain+
extra_scripts =
    pre:scripts/fw_version.py      ; `version` from git describe
    post:scripts/ldscript_dep.py   ; relink when ld/*.ld changes

upload_protocol = stlink
debug_tool      = stlink

[env:analog_servo_two_phase]
; Same NUCLEO-L152RE board/clock tree as env:analog_servo above (a real
; DAC1 gives clean independent Ia/Ib channels), but with Hall.c/
; Commutation.c actually compiled in and ANALOG_SERVO_TWO_PHASE_DRIVE
; defined so output.topology=two_phase_analog and the `commutation learn`/
; `commutation detect_poles` commands are real here instead of the
; degenerate always-idle/always-failed stubs env:analog_servo ships.
; NOT bench-verified -- no Hall sensor or sign-switch hardware on hand yet,
; see docs/two-phase-drive.md.
platform  = ststm32@~19.7.1
board     = nucleo_l152re
board_build.ldscript = ld/STM32L152RETX_FLASH.ld   ; stock + build-ID note, see that file
framework = stm32cube

build_src_filter = +<*> -<*_f1.c> -<stm32f1xx_it.c>
build_flags =
    -I include
    -D USE_HAL_DRIVER
    -D STM32L152xE
    -D HSE_VALUE=8000000
    -D SYSCLK_HZ=32000000
    -D ANALOG_SERVO_TWO_PHASE_DRIVE
    -D ANALOG_SERVO_HAS_AUTOTUNE   ; same L152 capability set as env:analog_servo --
                                   ; see that env's own comment.
    -D ANALOG_SERVO_HAS_UART
    -Wl,--build-id=sha1            ; image identity for `get build.id`

lib_ldf_mode = chain+
extra_scripts =
    pre:scripts/fw_version.py      ; `version` from git describe
    post:scripts/ldscript_dep.py   ; relink when ld/*.ld changes

upload_protocol = stlink
debug_tool      = stlink

; Known 128 KiB F103CB (or independently verified 128 KiB hardware) only.
; Code occupies 0x08000000..0x0801FBFF; config owns 0x0801FC00..0x0801FFFF.
; Not yet bench-validated. Flash size is a build choice, not runtime probing.
; Switching from the 64 KiB layout requires saving config again; no migration.
[env:analog_servo_f103_128k]
extends = env:analog_servo_f103
board = genericSTM32F103CB
board_build.ldscript = ld/STM32F103CBTX_FLASH.ld
board_upload.maximum_size = 130048
build_unflags = -D FLASH_IS_SCARCE

[env:native]
; Host-side unit tests for the HAL-independent math and logic: the cascaded
; P->PI control loop + anti-windup (Control.c), the Mode B ramp generator
; (Ramp.c), the point-to-point ramped position move built on top of it
; (PositionMove.c), the latched hard-fault detectors (Fault.c), the
; built-in open-loop test-signal generator (Signal.c), the polarity-learn
; pass/fail decision (Polarity.c), the relay-feedback velocity-loop
; autotune (Autotune.c), the online RLS self-tuning estimator (RLS.c) and
; its gain-interpolation primitive (GainGlide.c), the protocol
; parser/registry (Protocol.c), the GNU build-ID note decode (BuildId.c), and
; Hall-sector decode/encode (Hall.c) and
; the two-phase electrical-angle/Ia-Ib-synthesis/alignment-learning math
; (Commutation.c) -- tested here even though ANALOG_SERVO_TWO_PHASE_DRIVE
; isn't defined in this env (no reason not to keep exercising that pure
; fixed-point math on the host regardless of which board env it ships in).
; Protocol.c's `commutation.*`/`output.topology` commands exercise the
; degenerate (always-idle/failed) main.c stubs in THIS env, not Hall.c/
; Commutation.c through that path -- those get their own direct unit tests
; instead (test_hall/test_commutation).
; Run: pio test -e native
platform         = native
; Explicit plotting target only; does not add simmy to unit tests or MCU firmware.
; SIMMY_DIR selects its external checkout; SIMMY_PYTHON selects plotting Python.
extra_scripts    = scripts/simmy_target.py
test_framework   = unity
test_build_src   = yes
build_src_filter = -<*> +<Control.c> +<Ramp.c> +<PositionMove.c> +<Fault.c> +<Analog.c> +<Signal.c> +<Polarity.c> +<Protocol.c> +<Monitor.c> +<Autotune.c> +<RLS.c> +<GainGlide.c> +<Hall.c> +<Commutation.c> +<TinyFormat.c> +<BuildId.c>
build_flags =
    -I test/mocks
    -I test/support
    -I include
    -std=gnu11
    -Wall
    -lm
    -D SYSCLK_HZ=32000000
    -D ANALOG_SERVO_NATIVE_TEST    ; tells main.h's HAL-header#if chain to pick
                                   ; the mocked L1 header explicitly -- no
                                   ; real board macro is defined here, and
                                   ; main.h now errors rather than guessing.
    -D ANALOG_SERVO_HAS_AUTOTUNE   ; Protocol.c (linked into every test/test_*
                                   ; executable) needs its `autotune.*`/`rls.*`
                                   ; CLI surface compiled in for
                                   ; test_protocol.c's own coverage of it --
                                   ; same capability set as the L152 envs, see
                                   ; env:analog_servo's build_flags.
    -D ANALOG_SERVO_HAS_UART
; test/mocks listed FIRST: this project's include/usbd_cdc_composite_if.h is
; real -- it must be shadowed by test/mocks/usbd_cdc_composite_if.h, so the
; mock directory has to win the search order.
; test/support holds host-only test/demo helpers (PulseTrain.h) -- never
; built into real firmware, just a header search path for test_* sources.
