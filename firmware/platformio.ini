; PlatformIO Project Configuration File -- analog-servo firmware
; Closed-loop analog torque-command servo controller: takes either step/dir
; pulses (Mode A), a high-level velocity command (Mode B), or an analog
; velocity input (Mode C), runs a cascaded position(P)->velocity(PI) loop,
; and drives an external torque amplifier via DAC analog output.
;
; This build adds a second board, STM32F103C8T6 "Blue Pill": no on-chip
; DAC on that part at all, so its only output path is RC-filtered PWM
; (docs/rc-filter.md), not a DAC-vs-PWM toggle. No bench hours on this
; board yet -- see AGENTS.md. The baseline NUCLEO-L152RE env is unchanged
; below. Still unverified (other than these two boards): another MCU
; family, a second dedicated monitor UART, two-phase/Hall commutation
; output, Tamagawa feedback -- see AGENTS.md.

[platformio]
default_envs = analog_servo

[env:analog_servo]
platform  = ststm32@~19.7.1
board     = nucleo_l152re            ; Cat.5, 512K flash / 80K RAM, real DAC1 (PA4/PA5)
framework = stm32cube

build_src_filter = +<*> -<*_f1.c> -<stm32f1xx_it.c>
build_flags =
    -I include
    -D USE_HAL_DRIVER
    -D STM32L152xE
    -D HSE_VALUE=8000000          ; ST-Link's own MCO, NOT a crystal -- SystemClock_Config
                                   ; uses RCC_HSE_BYPASS, not RCC_HSE_ON.
    -D SYSCLK_HZ=32000000         ; 8 MHz HSE -> PLL x12 /3 = 32 MHz SYSCLK (L1's max).
                                   ; Drives Ramp.c's RAMP_DENOM -- keep in sync with
                                   ; SystemClock_Config (main.c).

lib_ldf_mode = chain+

upload_protocol = stlink
debug_tool      = stlink

[env:analog_servo_f103]
; STM32F103C8T6 "Blue Pill", LQFP48 -- only PC13/PC14/PC15 physically exist
; on Port C on this package (see docs/boards.md); no on-chip DAC silicon at
; all, torque output is RC-filtered PWM (docs/rc-filter.md). No bench hours
; behind this board -- clean build target only, see AGENTS.md.
platform  = ststm32@~19.7.1
board     = genericSTM32F103C8
framework = stm32cube

; Exclude the L1 glue -- *_l1.c/stm32l1xx_it.c reference peripherals (DAC,
; TIM6) that don't exist on F103 and/or would duplicate symbols (IRQ
; handlers, AdcInit/UsartInit/...) against this env's own *_f1.c files.
build_src_filter = +<*> -<*_l1.c> -<stm32l1xx_it.c>
build_flags =
    -I include
    -D USE_HAL_DRIVER
    -D STM32F103xB
    -D HSE_VALUE=8000000          ; Blue Pill crystal is 8 MHz; must hold exactly for the
                                   ; 48 MHz USB tap (72 MHz SYSCLK / 1.5) to land on-spec.
    -D SYSCLK_HZ=72000000         ; 8 MHz HSE -> PLL x9 -> 72 MHz SYSCLK. Drives Ramp.c's
                                   ; RAMP_DENOM -- keep in sync with SystemClock_Config (main.c).

lib_ldf_mode = chain+

upload_protocol = stlink
debug_tool      = stlink

[env:native]
; Host-side unit tests for the HAL-independent math and logic: the cascaded
; P->PI control loop + anti-windup (Control.c), the Mode B ramp generator
; (Ramp.c), the point-to-point ramped position move built on top of it
; (PositionMove.c), the latched hard-fault detectors (Fault.c), the
; built-in open-loop test-signal generator (Signal.c), the polarity-learn
; pass/fail decision (Polarity.c), the relay-feedback velocity-loop
; autotune (Autotune.c), and the protocol parser/registry (Protocol.c).
; Run: pio test -e native
platform         = native
test_framework   = unity
test_build_src   = yes
build_src_filter = -<*> +<Control.c> +<Ramp.c> +<PositionMove.c> +<Fault.c> +<Analog.c> +<Signal.c> +<Polarity.c> +<Protocol.c> +<Monitor.c> +<Autotune.c>
build_flags =
    -I test/mocks
    -I include
    -std=gnu11
    -Wall
    -lm
    -D SYSCLK_HZ=32000000
; test/mocks listed FIRST: this project's include/usbd_cdc_composite_if.h is
; real -- it must be shadowed by test/mocks/usbd_cdc_composite_if.h, so the
; mock directory has to win the search order.
