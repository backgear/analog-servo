name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run native unit tests
        run: pio test -d firmware -e native

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [analog_servo, analog_servo_f103, analog_servo_two_phase]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.environment }}-
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -d firmware -e ${{ matrix.environment }}
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            firmware/.pio/build/${{ matrix.environment }}/firmware.elf
            firmware/.pio/build/${{ matrix.environment }}/firmware.bin
          if-no-files-found: error

  host-tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      SIMMY_DIR: ${{ github.workspace }}/external/simmy
    steps:
      - uses: actions/checkout@v4
      - name: Check out published Simmy
        uses: actions/checkout@v4
        with:
          repository: backgear/simmy
          ref: f9ead095e0646f3c991b71e59adc547360b82f5b
          path: external/simmy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host test dependencies
        run: pip install numpy scipy matplotlib pyserial
      - name: Require Simmy integration dependency
        run: test -f "$SIMMY_DIR/include/simmy.h"
      - name: Run host-tool and simulation tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v

  # Separate from host-tests above on purpose: that job pins to a known
  # published Simmy commit (f9ead095...) that predates examples/pmsm_foc.h/
  # foc_transforms.h landing on simmy's main (backgear/simmy#3) -- bumping
  # that pin to pick up these two tests would also re-run every other
  # test_*.py there against a newer Simmy than it's actually pinned to.
  # This job checks out simmy's current main instead, explicitly for just
  # these two tests, named directly rather than via `discover` so this step
  # can't accidentally pick up tools/test_simmy_plot.py too, which is
  # unrelated and (as of this writing) fails to link against simmy's
  # current main -- see tools/test_simmy_*_integration.py's own header
  # comments for what each of these two actually proves.
  two-phase-simmy-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout simmy
        uses: actions/checkout@v4
        with:
          repository: backgear/simmy
          path: simmy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require Simmy's PMSM FOC example (examples/pmsm_foc.h)
        run: test -f "${{ github.workspace }}/simmy/examples/pmsm_foc.h"
      - name: Simmy plant simulation-integration tests
        env:
          SIMMY_DIR: ${{ github.workspace }}/simmy
        run: python3 -m unittest tools.test_simmy_foc_integration tools.test_simmy_commutation_learn_integration -v
